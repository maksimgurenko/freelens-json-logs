apiVersion: v1
kind: Namespace
metadata:
  name: readable-logs-ticket-16
---
apiVersion: v1
kind: Pod
metadata:
  name: profiles
  namespace: readable-logs-ticket-16
spec:
  containers:
    - name: json
      image: busybox:1.37.0
      command: [sh, -c]
      args:
        - |
          printf '%s\n' ' { "message":"Default message", "event":{"text":"Nested α🙂\nmessage","time":1000,"severity":30,"code":"E1","internal":"private"}, "log.level":"warning", "a/b":"slash", "a~b":"tilde", "items":[{"code":"first"}] } '
          printf '%s\n' '{"message":"Second","event":{"text":"Other","time":2000,"severity":"30","code":"E2","internal":"private"}}'
          sleep 86400
    - name: plain
      image: busybox:1.37.0
      command: [sh, -c, 'echo "Other container"; sleep 86400']
