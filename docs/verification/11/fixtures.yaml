apiVersion: v1
kind: Pod
metadata:
  name: readable-logs-ticket-11-mixed
  namespace: readable-logs-spike
  labels:
    app: readable-logs-ticket-11
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: mixed
      image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          printf '%s\n' \
            '{ "message" : "mixed JSON α🙂", "level": "warning", "time": "2026-10-21T07:00:00-05:00", "extra": {"intact":true} }' \
            '  plain text with spacing  ' \
            '{broken' \
            '[1,2]' \
            '"hello"' \
            '42' \
            'null' \
            '' \
            'Error: failed' \
            '    at worker()' \
            '{"msg":"first\nsecond","level":30}' \
            '{"log.level":"debug","log":{"level":"error"},"msg":"literal wins"}'
          exec sleep 2147483647
      resources:
        requests: {cpu: 5m, memory: 4Mi}
        limits: {cpu: 50m, memory: 16Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: readable-logs-ticket-11-waiting
  namespace: readable-logs-spike
  labels:
