      command: [sh, -c]
      args:
        - |
          printf '%s\n' ' { "message":"Default worker", "first":"First α🙂\nworker", "second":"Second worker", "fallback":"Fallback worker", "level":"info", "secret":"keep" } '
          sleep 86400
