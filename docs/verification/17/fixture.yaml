  name: readable-logs-ticket-17
---
apiVersion: v1
kind: Pod
metadata:
  name: profiles
  namespace: readable-logs-ticket-17
  labels:
    app: payments
    tier: backend
spec:
  containers:
    - name: api
      image: busybox:1.37.0
      command: [sh, -c]
      args:
        - |
          printf '%s\n' ' { "message":"Default api", "first":"First α🙂\napi", "second":"Second api", "fallback":"Fallback api", "level":"info", "secret":"keep" } '
          sleep 86400
    - name: worker
