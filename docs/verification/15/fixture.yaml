apiVersion: v1
kind: Namespace
metadata:
  name: readable-logs-ticket-15
---
apiVersion: v1
kind: Pod
metadata:
  name: navigation
  namespace: readable-logs-ticket-15
spec:
  containers:
    - name: records
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          i=0
          emit() {
            end=$((i + $1))
            while [ "$i" -lt "$end" ]; do
              i=$((i + 1))
              if [ "$i" -eq 20 ]; then
                printf '%s\n' '{"message":"decoded \u03b1\nline", "hidden":"Private.Needle[0]"}'
              elif [ "$i" -eq 30 ] || [ "$i" -eq 31 ]; then
                printf '%s\n' '{"message":"repeated message"}'
              else
                printf '{"message":"row %04d", "hidden":"Private.Needle[0]", "padding":"a long original field stays searchable while omitted from the compact message"}\n' "$i"
              fi
            done
          }
          emit 180
          while true; do
            if [ -f /tmp/emit ]; then
              count=$(cat /tmp/emit)
              rm /tmp/emit
              emit "$count"
            fi
            sleep 0.1
          done
  terminationGracePeriodSeconds: 1
