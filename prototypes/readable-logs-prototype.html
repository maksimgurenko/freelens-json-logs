function debugState(){return {variant:state.variant,source:'synthetic memory-only data',target:{cluster:'daily-cluster',namespace:'production',pod:'payments-7d8c9b6f5-x4k2m',uid:'demo-original-uid',container:state.container},profile:{selection:state.manual||'Auto',active:currentProfile().name,reason:profileReason(),globalDefault:state.global,order:profiles.map(p=>p.name),savedProfiles:profiles},refresh:{mode:modeText(),explicitPause:state.paused,readingHold:state.reading,busy:state.busy,requests:state.requests,lastUpdated:state.lastUpdated},window:{records:state.window.length,omitted:state.omitted,outdated:state.outdated,selected:state.selected},presentation:{raw:state.raw,timestamps:state.timestamps,wordWrap:state.wrap,detailTab:state.detailTab,query:state.query},openDecisions:['inspection placement','row wrapping and field overflow','scroll anchoring during snapshot replacement','separate-page compromise']};}

function labHTML(){return `<button class="icon quiet close" id="labClose" aria-label="Close prototype controls">${ico('close')}</button><h2>Compare the log-reading flow</h2><p>These controls drive synthetic data. The built-in reference is reconstructed from pinned Freelens 1.10.3 source; it is not the running host.</p><div class="labcontrols"><label for="scenario">Scenario</label><select id="scenario">${[['mixed','Mixed JSON, plaintext & malformed input'],['empty','Empty container output'],['denied','Access denied after a good snapshot'],['transient','Connection failure · retained logs'],['slow','Slow request · 15-second notice'],['huge','Bounded tail · older lines omitted'],['gone','Pod deleted or replaced']].map(([v,n])=>`<option value="${v}" ${state.scenario===v?'selected':''}>${n}</option>`).join('')}</select><button id="newSnapshot">Newer snapshot</button><button id="finishSlow">Settle slow request</button><button id="resetDemo">Reset</button></div><ul><li><b>Enter:</b> Pod actions → Readable logs. Compare the separate page against the built-in dock reference.</li><li><b>Read:</b> select a compact row, inspect all fields, then switch to Application text or Transport line and copy it. A expands inline; B uses a side inspector; C opens a bottom inspector.</li><li><b>Format:</b> choose Default manually; return to Auto. Open Profiles, duplicate a profile, edit paths and preview a sample, then Save or Cancel. Saved settings here are memory-only.</li><li><b>Refresh:</b> scroll up or inspect a record. Scrolling up stops following the tail while polling continues, as in native Logs. Pause freezes the recent window; To bottom follows again. Pause also keeps records available for profile changes. Refresh while paused fetches once.</li><li><b>Recover:</b> try empty, denied, connection failure, slow request and deleted-Pod states. Change container while an update is pending.</li></ul><p><b>Still proposals:</b> inspection placement, compact-field overflow, reading hold, and the separate-page trade-off. This prototype demonstrates interaction choices, not actual host speed, API cancellation or restart persistence.</p><p><a href="https://github.com/maksimgurenko/freelens-json-logs/issues/6" target="_blank" rel="noreferrer">Choose the readable log viewer interactions with a disposable prototype</a></p><details><summary>Relevant prototype state</summary><pre id="debugState"></pre></details>`;}
function showLab(){const lab=$('#lab');lab.hidden=!lab.hidden;if(lab.hidden)return;lab.innerHTML=labHTML();$('#labClose').onclick=()=>lab.hidden=true;$('#scenario').onchange=e=>resetScenario(e.target.value);$('#newSnapshot').onclick=()=>refresh(true);$('#finishSlow').onclick=()=>{state.scenario='mixed';const req=inflight.get(state.container);if(req)settle(req);};$('#resetDemo').onclick=()=>{profiles=[clone(builtin),{...clone(builtin),id:'payments',name:'Payments',inline:['/orderId','/error/code'],namespace:'production',container:'api',labels:[['app','payments']],enabled:true},{...clone(builtin),id:'worker',name:'Worker',message:['/event/text','/msg'],level:['/severity','/level'],inline:['/jobId'],maps:[{type:'number',source:'30',target:'INFO'}],container:'worker',enabled:true}];state.manual=null;state.global='default';resetScenario('mixed');};updateLab();}
function openEditor(id){editorProfiles=clone(profiles);editorGlobal=state.global;editorId=id;draft=clone(editorProfiles.find(p=>p.id===id)||editorProfiles[0]);sample=(state.window.find(r=>r.id===state.selected)||state.window.find(r=>r.obj)||{application:'{"msg":"Ready","level":"info"}'}).application;$('#editor').hidden=false;renderEditor();$('#editor').querySelector('input,button')?.focus();}
function closeEditor(){draft=null;editorId=null;editorProfiles=null;$('#editor').hidden=true;}
function listInput(key,title,hint){return `<label class="field">${title}<textarea data-field="${key}" rows="${Math.max(2,Math.min(4,draft[key].length))}" spellcheck="false">${esc(draft[key].join('\n'))}</textarea><small>${hint}</small></label>`;}
function renderEditor(){
  const editor=$('#editor');editor.innerHTML=`<header><h2>Formatting profiles</h2><button class="icon quiet" id="closeEditor" aria-label="Close profile editor and discard draft">${ico('close')}</button></header><div class="editorlayout"><nav class="profilelist" aria-label="Saved profiles">${editorProfiles.map(p=>`<button data-edit="${p.id}" class="${p.id===editorId?'active':''}">${esc(p.name)}${p.id==='default'?'<small>built-in</small>':''}</button>`).join('')}<small>Order controls automatic matching.</small><div class="tools"><button id="duplicate">Duplicate</button><button id="moveUp" ${editorId==='default'?'disabled':''}>Move up</button><button id="moveDown" ${editorId==='default'?'disabled':''}>Move down</button><button id="deleteProfile" ${editorId==='default'?'disabled':''}>Delete</button></div><label for="globalDefault">Global default</label><select id="globalDefault">${editorProfiles.map(p=>`<option value="${p.id}" ${editorGlobal===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></nav><div class="editorform">${editorId==='default'?`<div class="builtin"><h3>Built-in Default</h3><p>This read-only profile uses the agreed default aliases, local-time display and no inline extras or custom severity mapping.</p><p>Duplicate it to make an independent named profile. Existing profiles do not inherit future changes.</p><button class="primary" id="duplicateBuiltin">Duplicate Default</button></div>`:editorFields()}</div></div><footer class="editfooter"><small>${editorId==='default'?'Built-in fields are read-only':'Draft changes · Save to apply'}</small><button id="cancelEditor">Cancel</button><button class="primary" id="saveProfile">Save</button></footer>`;
  $('#closeEditor').onclick=closeEditor;$('#cancelEditor').onclick=closeEditor;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{if(editorId!=='default')collectDraft();editorProfiles[editorProfiles.findIndex(p=>p.id===editorId)]=clone(draft);editorId=b.dataset.edit;draft=clone(editorProfiles.find(p=>p.id===editorId));renderEditor();});$('#duplicate').onclick=duplicateProfile;$('#duplicateBuiltin')?.addEventListener('click',duplicateProfile);$('#deleteProfile').onclick=()=>{editorProfiles=editorProfiles.filter(p=>p.id!==editorId);if(editorGlobal===editorId)editorGlobal='default';editorId='default';draft=clone(editorProfiles[0]);renderEditor();notice('Deletion is staged until Save.');};$('#globalDefault').onchange=e=>{editorGlobal=e.target.value;notice('Global default change is staged until Save.');};$('#moveUp').onclick=()=>moveProfile(-1);$('#moveDown').onclick=()=>moveProfile(1);
  $('#saveProfile').onclick=saveEditor;
  if(editorId==='default')return;
  document.querySelectorAll('[data-field]').forEach(el=>el.oninput=()=>{collectDraft();renderPreview();});$('#addMap').onclick=()=>{collectDraft();draft.maps.push({type:'number',source:'30',target:'INFO'});renderEditor();};document.querySelectorAll('[data-remove-map]').forEach(b=>b.onclick=()=>{collectDraft();draft.maps.splice(Number(b.dataset.removeMap),1);renderEditor();});document.querySelectorAll('.maprow select,.maprow input').forEach(el=>el.oninput=()=>{collectDraft();renderPreview();});$('#sample').oninput=()=>{sample=$('#sample').value;renderPreview();};$('#useSelected').onclick=()=>{const r=state.window.find(r=>r.id===state.selected)||state.window.find(r=>r.obj);if(r){sample=r.application;$('#sample').value=sample;renderPreview();}};
  renderPreview();
}
function editorFields(){return `<label class="field">Profile name<input data-field="name" value="${esc(draft.name)}" autocomplete="off"></label><div class="threecol">${listInput('message','Message paths','First usable string wins; one path per line.')}${listInput('time','Time paths','Explicit timezone, or configured numeric units.')}${listInput('level','Level paths','Literal /log.level differs from /log/level.')}</div><div class="twocol">${listInput('inline','Inline fields','Exact path order; only extra fields appear compactly.')}${listInput('hidden','Hidden compact fields','Full record and original text stay available.')}</div><label class="field">Numeric application timestamps<select data-field="unit"><option value="unset" ${draft.unit==='unset'?'selected':''}>Unset · use Kubernetes time for numeric values</option><option value="seconds" ${draft.unit==='seconds'?'selected':''}>Seconds</option><option value="milliseconds" ${draft.unit==='milliseconds'?'selected':''}>Milliseconds</option></select></label><details><summary>Automatic matching</summary><label class="check"><input type="checkbox" data-field="enabled" ${draft.enabled?'checked':''}>Enabled for matching</label><p>All configured conditions must match exactly. No conditions means no automatic match.</p><div class="twocol"><label class="field">Namespace<input data-field="namespace" value="${esc(draft.namespace)}" placeholder="Any namespace"></label><label class="field">Container<input data-field="container" value="${esc(draft.container)}" placeholder="Any container"></label></div><label class="field">Pod labels · one key=value per line<textarea data-field="labels" rows="2">${esc(draft.labels.map(x=>x.join('=')).join('\n'))}</textarea></label></details><details><summary>Severity mappings</summary><p>Number 30 and text “30” are different source values. Text matching is case-insensitive.</p><div id="mapRows">${draft.maps.map((m,i)=>`<div class="maprow"><select data-map-type aria-label="Source type"><option value="number" ${m.type==='number'?'selected':''}>Number</option><option value="string" ${m.type==='string'?'selected':''}>Text</option></select><input data-map-source aria-label="Original severity" value="${esc(m.source)}"><select data-map-target aria-label="Canonical severity">${levels.map(l=>`<option ${m.target===l?'selected':''}>${l}</option>`).join('')}</select><button data-remove-map="${i}" aria-label="Remove severity mapping">${ico('close')}</button></div>`).join('')}</div><button id="addMap">Add mapping</button></details><details open><summary>Preview against a sample</summary><button id="useSelected" class="quiet">Use selected record</button><label class="field">Application text<textarea id="sample" rows="3" spellcheck="false">${esc(sample)}</textarea></label><div class="preview" id="preview"></div><small id="previewHint"></small></details><div class="validation" id="validation" role="alert"></div>`;}
function collectDraft(){document.querySelectorAll('[data-field]').forEach(el=>{const k=el.dataset.field;if(['message','time','level','inline','hidden'].includes(k))draft[k]=el.value.split('\n').map(v=>v.trim()).filter(Boolean);else if(k==='enabled')draft[k]=el.checked;else if(k==='labels')draft[k]=el.value.split('\n').filter(Boolean).map(v=>{const i=v.indexOf('=');return i<0?[v,'']:[v.slice(0,i),v.slice(i+1)];});else draft[k]=el.value;});draft.maps=[...document.querySelectorAll('.maprow')].map(row=>({type:row.querySelector('[data-map-type]').value,source:row.querySelector('[data-map-source]').value,target:row.querySelector('[data-map-target]').value}));}
function validateDraft(){if(!draft.name.trim())return'Enter a profile name.';if(draft.name.trim()==='Default')return'Default is reserved for the built-in profile.';if(editorProfiles.some(p=>p.id!==draft.id&&p.name===draft.name.trim()))return'Choose a unique profile name.';for(const k of ['message','time','level','inline','hidden'])for(const path of draft[k])if(!path.startsWith('/')||/~(?![01])/u.test(path))return`Invalid path “${path}”. Start with /; escape ~ as ~0 and a literal / inside a key as ~1.`;for(const m of draft.maps)if(!m.source.trim()||m.type==='number'&&!Number.isFinite(Number(m.source)))return'Enter a valid source value for each severity mapping.';if(draft.labels.some(([k,v])=>!k||!v))return'Each Pod label needs a key=value condition.';return'';}
function renderPreview(){const err=validateDraft();$('#validation').textContent=err;if(err){$('#preview').innerHTML='<small>Fix the draft error to preview this profile.</small>';return;}previewRecord=record(sample,'preview');$('#preview').innerHTML=rowHTML(previewRecord,true,draft);$('#previewHint').textContent='Draft preview only. Missing fields follow the normal fallback rules.';}
function saveEditor(){
  if(editorId!=='default')collectDraft();
  editorProfiles[editorProfiles.findIndex(p=>p.id===editorId)]=clone(draft);
  const activeDraft=draft;
  for(const p of editorProfiles){if(p.id==='default')continue;draft=p;const err=validateDraft();if(err){draft=activeDraft;$('#validation')?$('#validation').textContent=`${p.name}: ${err}`:notice(err);return;}}
  draft=activeDraft;
  profiles=clone(editorProfiles).map(p=>({...p,name:p.name.trim(),unsaved:false}));state.global=editorGlobal;
  if(state.manual&&!profiles.some(p=>p.id===state.manual))state.manual=null;
  closeEditor();const top=$('#logscroll')?.scrollTop||0;render();if($('#logscroll'))$('#logscroll').scrollTop=top;notice('Profiles saved · existing records reformatted without fetching.');
}
function duplicateProfile(){if(draft&&editorId!=='default'){collectDraft();editorProfiles[editorProfiles.findIndex(p=>p.id===editorId)]=clone(draft);}const original=editorProfiles.find(p=>p.id===editorId),base=original.name==='Default'?'New profile':original.name+' copy';let name=base,n=2;while(editorProfiles.some(p=>p.name===name))name=base+' '+n++;const p={...clone(original),id:'draft-'+Date.now(),name,enabled:false,unsaved:true};editorProfiles.push(p);editorId=p.id;draft=clone(p);renderEditor();notice('Independent copy created · Save to apply it.');}
function moveProfile(delta){const i=editorProfiles.findIndex(p=>p.id===editorId),j=i+delta;if(j<1||j>=editorProfiles.length)return;[editorProfiles[i],editorProfiles[j]]=[editorProfiles[j],editorProfiles[i]];renderEditor();notice('Order change is staged until Save.');}

$('#prevVariant').innerHTML=ico('left');$('#nextVariant').innerHTML=ico('right');$('#prevVariant').onclick=()=>switchVariant(-1);$('#nextVariant').onclick=()=>switchVariant(1);$('#labToggle').onclick=showLab;$('#referenceToggle').onclick=()=>{stop();state.generation++;state.busy=inflight.has(state.container);state.reference=!state.reference;state.selected=null;state.page='logs';render();scrollBottom(false);if(!state.reference)schedule();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#editor').hidden)closeEditor();else $('#lab').hidden=true;}if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();switchVariant(e.key==='ArrowRight'?1:-1);}});
document.addEventListener('visibilitychange',()=>{stop();if(document.hidden){state.generation++;pendingFresh.delete(state.container);}else if(!state.paused&&!state.error&&state.page==='logs'&&!state.reference)refresh(false);});
resetScenario('mixed');
</script>
</body>
